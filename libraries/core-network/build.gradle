apply from: "$project.rootDir/gradle_scripts/java-version-android-library.gradle"

android {
    namespace 'kz.zeme.converter.core.network'
}

dependencies {
    implementation project(':core')
    implementation project(':core-error')
    implementation project(':core-observable')

    implementation appLibs.koin.core
